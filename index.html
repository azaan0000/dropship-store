<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Drift — Trending Online Store | Shop Curated Finds, Best Deals & Fast Shipping</title>
<meta name="description" content="Shop trending products at unbeatable prices on Drift. Curated fashion, electronics, home goods and more — fast worldwide shipping, secure checkout, new arrivals daily.">
<meta name="keywords" content="online shopping, trending products, best deals, curated store, buy online, fast shipping, worldwide delivery, drift store, discount shopping">
<meta property="og:title" content="Drift — Trending Online Store">
<meta property="og:description" content="Curated finds worth the scroll. Shop trending products with fast worldwide shipping.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d0c14">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14121f; --paper: #0d0c14; --surface: rgba(255,255,255,0.06);
    --surface-solid: #1a1826; --line: rgba(255,255,255,0.10); --text: #f2f0f8;
    --muted: #9a95ad; --violet: #8b7cff; --coral: #ff7a6b; --teal: #3fe0c5; --gold: #ffc86b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--paper); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  a { color: inherit; }

  .aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(70px); opacity: 0.5; }
  .aurora span { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  .aurora span:nth-child(1) { width: 55vw; height: 55vw; background: var(--violet); top: -10%; left: -10%; animation: drift1 26s ease-in-out infinite; }
  .aurora span:nth-child(2) { width: 45vw; height: 45vw; background: var(--coral); bottom: -15%; right: -10%; animation: drift2 32s ease-in-out infinite; }
  .aurora span:nth-child(3) { width: 38vw; height: 38vw; background: var(--teal); top: 40%; left: 55%; animation: drift3 22s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(15vw,10vh) scale(1.15)} 66%{transform:translate(-5vw,18vh) scale(0.9)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-18vw,-14vh) scale(1.2)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 40%{transform:translate(-12vw,8vh) scale(0.85)} 75%{transform:translate(8vw,-10vh) scale(1.1)} }
  @media (prefers-reduced-motion: reduce) { .aurora span{animation:none!important} *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

  header { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(20px) saturate(140%); background: rgba(13,12,20,0.72); border-bottom: 1px solid var(--line); }
  .header-top { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--violet), var(--coral)); box-shadow: 0 0 16px var(--violet); }
  nav.desktop-nav { display: none; gap: 22px; font-size: 0.88rem; font-weight: 500; color: var(--muted); }
  nav.desktop-nav a:hover { color: var(--text); }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .cart-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 9px 16px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: transform .15s, background .2s; }
  .cart-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.12); }
  .badge { background: linear-gradient(135deg, var(--coral), var(--gold)); border-radius: 999px; min-width: 20px; height: 20px; padding: 0 5px; font-size: 0.72rem; display: flex; align-items: center; justify-content: center; color: #1a1220; font-weight: 700; }

  .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 12px; scrollbar-width: none; }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-pill { flex-shrink: 0; padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.8rem; font-weight: 600; color: var(--muted); white-space: nowrap; transition: all .2s ease; }
  .cat-pill.active, .cat-pill:active { background: linear-gradient(135deg, var(--violet), #6a5acd); color: white; border-color: transparent; }

  main { position: relative; z-index: 2; padding-bottom: 60px; max-width: 1200px; margin: 0 auto; }
  .hero { padding: 34px 20px 18px; }
  .hero-eyebrow { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .hero-eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--teal); }
  .hero h1 { font-size: 2rem; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; background: linear-gradient(100deg, #fff 30%, var(--violet) 65%, var(--coral) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% auto; animation: shine 6s linear infinite; }
  @keyframes shine { to { background-position: 200% center; } }
  .hero p { margin-top: 10px; color: var(--muted); font-size: 0.92rem; max-width: 40ch; }

  .search-bar { padding: 16px 20px 6px; display: flex; gap: 10px; }
  .search-wrap { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; padding: 0 14px; transition: border-color .2s; }
  .search-wrap:focus-within { border-color: var(--violet); }
  .search-wrap svg { flex-shrink: 0; opacity: 0.5; }
  .search-wrap input { flex: 1; background: none; border: none; outline: none; color: var(--text); padding: 12px 10px; font-size: 0.95rem; font-family: inherit; }
  .search-wrap input::placeholder { color: var(--muted); }
  .go-btn { background: linear-gradient(135deg, var(--violet), #6a5acd); border: none; color: white; border-radius: 14px; padding: 0 20px; font-weight: 600; font-size: 0.9rem; transition: transform .15s, filter .2s; }
  .go-btn:active { transform: scale(0.94); filter: brightness(1.15); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; padding: 16px 20px 20px; }
  .product-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; backdrop-filter: blur(10px); transform: perspective(600px) rotateX(0) rotateY(0); transition: transform .35s cubic-bezier(.2,.9,.3,1.2), border-color .3s, box-shadow .3s; opacity: 0; animation: rise .6s cubic-bezier(.2,.9,.3,1.1) forwards; cursor: pointer; }
  .product-card:active { transform: perspective(600px) rotateX(4deg) rotateY(-4deg) scale(0.98); border-color: rgba(139,124,255,0.5); box-shadow: 0 12px 30px rgba(139,124,255,0.25); }
  @keyframes rise { from{opacity:0;transform:translateY(18px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
  .product-img-wrap { position: relative; aspect-ratio: 1; overflow: hidden; background: #201d2e; }
  .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
  .product-card:active .product-img-wrap img { transform: scale(1.08); }
  .product-img-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(13,12,20,0.7) 100%); }
  .product-info { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .product-name { font-size: 0.84rem; line-height: 1.35; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price-row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
  .price { font-size: 1.1rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .price-gradient { background: linear-gradient(135deg, var(--teal), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .add-btn { margin-top: 8px; position: relative; overflow: hidden; background: var(--surface-solid); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px; font-size: 0.82rem; font-weight: 600; transition: background .2s, border-color .2s; }
  .add-btn.added { background: linear-gradient(135deg, var(--teal), #2bb89f); border-color: transparent; color: #06231d; }
  .add-btn:active { transform: scale(0.96); }

  .load-more-wrap { display: flex; justify-content: center; padding: 10px 20px 30px; }
  .load-more-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); padding: 12px 30px; border-radius: 999px; font-weight: 600; font-size: 0.88rem; }
  .load-more-btn:active { transform: scale(0.96); }
  .load-more-btn:disabled { opacity: 0.5; }

  .state-msg { text-align: center; padding: 70px 24px; color: var(--muted); font-size: 0.9rem; grid-column: 1 / -1; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 16px; border: 3px solid var(--line); border-top-color: var(--violet); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { position: relative; z-index: 2; border-top: 1px solid var(--line); padding: 40px 20px 90px; margin-top: 20px; }
  .footer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
  .footer-col h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }
  .footer-col button { display: block; background: none; border: none; color: var(--text); font-size: 0.86rem; padding: 6px 0; text-align: left; opacity: 0.85; }
  .footer-bottom { text-align: center; margin-top: 30px; font-size: 0.78rem; color: var(--muted); }

  .cart-drawer { position: fixed; inset: 0; background: rgba(10,9,16,0.6); backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .cart-drawer.open { opacity: 1; pointer-events: auto; }
  .cart-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 88%; max-width: 400px; background: var(--surface-solid); border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .4s cubic-bezier(.2,.9,.2,1); }
  .cart-drawer.open .cart-panel { transform: translateX(0); }
  .cart-header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .cart-header strong { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; }
  .cart-items { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cart-item img { width: 58px; height: 58px; border-radius: 10px; object-fit: cover; }
  .cart-item-info { flex: 1; font-size: 0.85rem; }
  .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .qty-controls button { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 1rem; }
  .cart-footer { padding: 18px 20px; border-top: 1px solid var(--line); }
  .checkout-btn { width: 100%; background: linear-gradient(135deg, var(--coral), var(--violet)); color: white; border: none; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 1rem; margin-top: 12px; transition: transform .15s, filter .2s; }
  .checkout-btn:active { transform: scale(0.97); filter: brightness(1.1); }
  .close-btn { background: none; border: none; font-size: 1.4rem; color: var(--muted); }

  .modal { position: fixed; inset: 0; background: rgba(10,9,16,0.6); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-panel { background: var(--surface-solid); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 24px; border-top: 1px solid var(--line); transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.9,.2,1); }
  .modal.open .modal-panel { transform: translateY(0); }
  .modal-panel h2 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 16px; font-size: 1.3rem; }
  .modal-panel h3 { font-size: 1rem; margin: 14px 0 8px; }
  .modal-panel p, .modal-panel li { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
  .modal-panel ul { padding-left: 18px; margin: 6px 0; }
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
  .form-field input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 0.95rem; color: var(--text); font-family: inherit; transition: border-color .2s; }
  .form-field input:focus { outline: none; border-color: var(--violet); }
  .submit-btn { width: 100%; background: linear-gradient(135deg, var(--teal), #2bb89f); color: #06231d; border: none; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 1rem; margin-top: 8px; }
  .submit-btn:active { transform: scale(0.97); }

  .quickview-img { width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: #201d2e; }
  .quickview-img img { width: 100%; height: 100%; object-fit: cover; }
  .variant-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
  .variant-chip { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 0.8rem; }
  .variant-chip.selected { border-color: var(--violet); background: rgba(139,124,255,0.15); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface-solid); border: 1px solid var(--line); color: var(--text); padding: 14px 22px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; z-index: 60; opacity: 0; transition: all .3s cubic-bezier(.2,.9,.2,1); box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 720px) {
    nav.desktop-nav { display: flex; }
    .hero h1 { font-size: 2.8rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .footer-grid { grid-template-columns: repeat(4, 1fr); }
    .modal { align-items: center; justify-content: center; }
    .modal-panel { max-width: 480px; border-radius: 24px; transform: translateY(30px) scale(0.97); }
    .modal.open .modal-panel { transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

<header>
  <div class="header-top">
    <div class="brand"><span class="dot"></span> Drift</div>
    <nav class="desktop-nav">
      <a href="#shop">Shop</a>
      <a href="#" onclick="openFooterModal('about');return false;">About</a>
      <a href="#" onclick="openFooterModal('contact');return false;">Contact</a>
      <a href="#" onclick="openFooterModal('shipping');return false;">Shipping</a>
    </nav>
    <div class="header-actions">
      <button class="cart-btn" onclick="openCart()">Bag <span class="badge" id="cartCount">0</span></button>
    </div>
  </div>
  <div class="cat-bar" id="catBar"></div>
</header>

<main id="shop">
  <section class="hero">
    <div class="hero-eyebrow">Trending now</div>
    <h1 class="display">Finds worth<br>the scroll.</h1>
    <p>Hand-picked pieces, unbeatable prices, shipped straight to your door — new arrivals daily.</p>
  </section>

  <div class="search-bar">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Search trending products..." onkeydown="if(event.key==='Enter'){resetAndLoad()}">
    </div>
    <button class="go-btn" onclick="resetAndLoad()">Go</button>
  </div>

  <div id="grid" class="grid">
    <div class="state-msg"><div class="spinner"></div>Loading products…</div>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadProducts(true)">Load more</button>
  </div>
</main>

<footer>
  <div class="footer-grid">
    <div class="footer-col">
      <h4>Shop</h4>
      <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">All Products</button>
      <button onclick="document.getElementById('searchInput').focus()">Search</button>
    </div>
    <div class="footer-col">
      <h4>Company</h4>
      <button onclick="openFooterModal('about')">About Us</button>
      <button onclick="openFooterModal('contact')">Contact</button>
    </div>
    <div class="footer-col">
      <h4>Support</h4>
      <button onclick="openFooterModal('shipping')">Shipping & Delivery</button>
      <button onclick="openFooterModal('returns')">Returns & Refunds</button>
    </div>
    <div class="footer-col">
      <h4>Legal</h4>
      <button onclick="openFooterModal('privacy')">Privacy Policy</button>
      <button onclick="openFooterModal('terms')">Terms & Disclaimer</button>
    </div>
  </div>
  <div class="footer-bottom">© 2026 Drift Store. All rights reserved.</div>
</footer>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cartDrawer" onclick="if(event.target===this) closeCart()">
  <div class="cart-panel">
    <div class="cart-header"><strong class="display">Your Bag</strong><button class="close-btn" onclick="closeCart()">×</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div style="display:flex;justify-content:space-between;font-weight:700;font-family:'Space Grotesk',sans-serif;"><span>Total</span><span id="cartTotal">$0.00</span></div>
      <button class="checkout-btn" onclick="openCheckout()">Checkout →</button>
    </div>
  </div>
</div>

<!-- Checkout Modal -->
<div class="modal" id="checkoutModal" onclick="if(event.target===this) this.classList.remove('open')">
  <div class="modal-panel">
    <h2>Delivery Details</h2>
    <form id="checkoutForm" onsubmit="submitOrder(event)">
      <div class="form-field"><label>Full Name</label><input required id="cName"></div>
      <div class="form-field"><label>Email</label><input required type="email" id="cEmail"></div>
      <div class="form-field"><label>Phone</label><input required id="cPhone"></div>
      <div class="form-field"><label>Address</label><input required id="cAddress"></div>
      <div class="form-field"><label>City</label><input required id="cCity"></div>
      <div class="form-field"><label>Province/State</label><input required id="cProvince"></div>
      <div class="form-field"><label>ZIP / Postal Code</label><input required id="cZip"></div>
      <div class="form-field"><label>Country Code (e.g. PK, US, GB)</label><input required id="cCountry" maxlength="2"></div>
      <button class="submit-btn" type="submit">Place Order</button>
    </form>
  </div>
</div>

<!-- Quick View Modal -->
<div class="modal" id="quickViewModal" onclick="if(event.target===this) this.classList.remove('open')">
  <div class="modal-panel" id="quickViewContent"></div>
</div>

<!-- Footer Info Modal -->
<div class="modal" id="footerModal" onclick="if(event.target===this) this.classList.remove('open')">
  <div class="modal-panel" id="footerModalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = "https://dropship-worker.azaanbk30.workers.dev";
  let products = [], cart = [], currentPage = 1, currentKeyword = "", currentCategoryId = "";

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  async function loadCategories() {
    try {
      const res = await fetch(`${API_BASE}/api/categories`);
      const data = await res.json();
      const cats = (data.categories || []).slice(0, 12);
      const bar = document.getElementById("catBar");
      bar.innerHTML = `<button class="cat-pill active" data-id="" onclick="selectCategory('', this)">All</button>` +
        cats.map(c => `<button class="cat-pill" data-id="${c.id}" onclick="selectCategory('${c.id}', this)">${c.name}</button>`).join("");
    } catch (e) { /* categories are optional */ }
  }
  function selectCategory(id, btn) {
    currentCategoryId = id;
    document.querySelectorAll(".cat-pill").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    resetAndLoad();
  }

  function resetAndLoad() {
    currentPage = 1;
    currentKeyword = document.getElementById("searchInput").value.trim();
    products = [];
    loadProducts(false);
  }

  async function loadProducts(append) {
    const grid = document.getElementById("grid");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    if (!append) grid.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading products…</div>';
    else { loadMoreBtn.textContent = "Loading…"; loadMoreBtn.disabled = true; }

    try {
      const qs = new URLSearchParams({ page: String(currentPage) });
      if (currentKeyword) qs.set("keyword", currentKeyword);
      if (currentCategoryId) qs.set("categoryId", currentCategoryId);
      const res = await fetch(`${API_BASE}/api/products?${qs.toString()}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      const newProducts = data.products || [];
      products = append ? products.concat(newProducts) : newProducts;
      currentPage += 1;
      renderProducts();
      document.getElementById("loadMoreWrap").style.display = newProducts.length >= 20 ? "flex" : "none";
    } catch (err) {
      grid.innerHTML = `<div class="state-msg">Couldn't load products.<br><span style="opacity:0.7">${err.message}</span></div>`;
      document.getElementById("loadMoreWrap").style.display = "none";
    } finally {
      loadMoreBtn.textContent = "Load more"; loadMoreBtn.disabled = false;
    }
  }

  function renderProducts() {
    const grid = document.getElementById("grid");
    if (!products.length) { grid.innerHTML = '<div class="state-msg">No products found. Try a different search.</div>'; return; }
    grid.innerHTML = products.map((p, i) => `
      <div class="product-card" style="animation-delay:${(i % 20) * 0.04}s" onclick="openQuickView('${p.id}')">
        <div class="product-img-wrap"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="price-row"><span class="price price-gradient">$${p.sellingPrice}</span></div>
          <button class="add-btn" onclick='event.stopPropagation();addToCart(${JSON.stringify(p).replace(/'/g,"&apos;")}, this)'>Add to Bag</button>
        </div>
      </div>
    `).join("");
  }

  async function openQuickView(pid) {
    const modal = document.getElementById("quickViewModal");
    const content = document.getElementById("quickViewContent");
    content.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading…</div>';
    modal.classList.add("open");
    try {
      const res = await fetch(`${API_BASE}/api/product?pid=${pid}`);
      const p = await res.json();
      if (p.error) throw new Error(p.error);
      const mainImg = (p.images && p.images[0]) || "";
      const variants = p.variants || [];
      content.innerHTML = `
        <div class="quickview-img"><img src="${mainImg}" alt="${p.name}"></div>
        <h2>${p.name}</h2>
        <p>${(p.description || "").replace(/<[^>]*>/g, "").slice(0, 220)}...</p>
        ${variants.length ? `<div class="variant-row">${variants.slice(0,8).map((v,i)=>`<button class="variant-chip ${i===0?'selected':''}" data-vid="${v.vid}" data-price="${v.sellingPrice}" onclick="selectVariant(this)">${v.name} — $${v.sellingPrice}</button>`).join("")}</div>` : ""}
        <button class="submit-btn" onclick='addSelectedVariant(${JSON.stringify({id:p.id,name:p.name,image:mainImg}).replace(/'/g,"&apos;")})'>Add to Bag</button>
      `;
    } catch (err) {
      content.innerHTML = `<div class="state-msg">Couldn't load product.<br>${err.message}</div>`;
    }
  }
  function selectVariant(btn) {
    document.querySelectorAll(".variant-chip").forEach(c => c.classList.remove("selected"));
    btn.classList.add("selected");
  }
  function addSelectedVariant(base) {
    const selected = document.querySelector(".variant-chip.selected");
    const id = selected ? selected.dataset.vid : base.id;
    const price = selected ? parseFloat(selected.dataset.price) : null;
    if (!price) { showToast("Select a size/variant first"); return; }
    addToCart({ id, name: base.name, image: base.image, sellingPrice: price });
    document.getElementById("quickViewModal").classList.remove("open");
  }

  function addToCart(product, btn) {
    const existing = cart.find(i => i.id === product.id);
    if (existing) existing.qty += 1;
    else cart.push({ ...product, qty: 1 });
    updateCartUI();
    if (btn) { btn.textContent = "Added ✓"; btn.classList.add("added"); setTimeout(() => { btn.textContent = "Add to Bag"; btn.classList.remove("added"); }, 900); }
    showToast(`${product.name.slice(0, 28)}… added`);
  }
  function updateCartUI() {
    document.getElementById("cartCount").textContent = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById("cartItems").innerHTML = cart.map(i => `
      <div class="cart-item">
        <img src="${i.image}" alt="${i.name}">
        <div class="cart-item-info">
          <div>${i.name}</div>
          <div class="price-gradient" style="font-weight:700">$${i.sellingPrice}</div>
          <div class="qty-controls"><button onclick="changeQty('${i.id}', -1)">−</button><span>${i.qty}</span><button onclick="changeQty('${i.id}', 1)">+</button></div>
        </div>
      </div>
    `).join("") || '<div class="state-msg" style="padding:40px 0">Your bag is empty</div>';
    document.getElementById("cartTotal").textContent = `$${cart.reduce((s, i) => s + i.sellingPrice * i.qty, 0).toFixed(2)}`;
  }
  function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
    updateCartUI();
  }
  function openCart() { document.getElementById("cartDrawer").classList.add("open"); }
  function closeCart() { document.getElementById("cartDrawer").classList.remove("open"); }
  function openCheckout() {
    if (!cart.length) { showToast("Your bag is empty"); return; }
    closeCart();
    document.getElementById("checkoutModal").classList.add("open");
  }

  async function submitOrder(e) {
    e.preventDefault();
    const payload = {
      shippingCustomerName: document.getElementById("cName").value,
      email: document.getElementById("cEmail").value,
      shippingPhone: document.getElementById("cPhone").value,
      shippingAddress: document.getElementById("cAddress").value,
      shippingCity: document.getElementById("cCity").value,
      shippingProvince: document.getElementById("cProvince").value,
      shippingZip: document.getElementById("cZip").value,
      shippingCountryCode: document.getElementById("cCountry").value.toUpperCase(),
      products: cart.map(i => ({ vid: i.id, quantity: i.qty, sellingPrice: i.sellingPrice })),
    };
    try {
      const res = await fetch(`${API_BASE}/api/checkout`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      window.location = data.checkoutUrl;
    } catch (err) { showToast("Checkout failed: " + err.message); }
  }

  const FOOTER_CONTENT = {
    about: { title: "About Drift", body: `<p>Drift is a curated online store bringing you trending, hand-picked products from around the world at honest prices. We partner with vetted global suppliers so you get quality items without the markup of traditional retail.</p><p>Every product on Drift is selected for quality, style, and value — so you spend less time searching and more time enjoying what you find.</p>` },
    contact: { title: "Contact Us", body: `<p>Have a question about your order or a product? We're here to help.</p><ul><li>Email: support@driftstore.example</li><li>Response time: within 24–48 hours</li></ul>` },
    shipping: { title: "Shipping & Delivery", body: `<p>Orders are processed within 1–2 business days. Since our products ship from our global fulfillment network, delivery typically takes 7–15 business days depending on your location.</p><p>You'll receive a tracking number by email once your order ships, so you can follow it every step of the way.</p>` },
    returns: { title: "Returns & Refunds", body: `<p>If your item arrives damaged or not as described, contact us within 7 days of delivery with photos and your order number, and we'll arrange a replacement or refund.</p><p>Change-of-mind returns are accepted within 14 days for unused items in original packaging (return shipping costs may apply).</p>` },
    privacy: { title: "Privacy Policy", body: `<p>We collect only the information needed to process your order — name, shipping address, email and phone number. We never sell your data to third parties.</p><p>Payment information is handled securely by our payment processor and is never stored on our servers.</p>` },
    terms: { title: "Terms & Disclaimer", body: `<p>By placing an order on Drift, you agree to our shipping, returns, and privacy terms outlined above.</p><p>Product images are for illustration; slight variations in color or packaging may occur. Prices are subject to change without notice.</p>` },
  };
  function openFooterModal(key) {
    const c = FOOTER_CONTENT[key];
    document.getElementById("footerModalContent").innerHTML = `<h2>${c.title}</h2>${c.body}`;
    document.getElementById("footerModal").classList.add("open");
  }

  loadCategories();
  resetAndLoad();
</script>
</body>
</html>
